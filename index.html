<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyALdOdmHX5_PDWI4NJ1c5jHho1PBx-pkXE",
  authDomain: "chiosco-ufficio.firebaseapp.com",
  projectId: "chiosco-ufficio",
  storageBucket: "chiosco-ufficio.firebasestorage.app",

<script>
/* Strato di compatibilità: espone window.claude.use('db'|'downloads') sopra Firebase (Firestore + login Google).
   Richiede firebase-config.js (window.FIREBASE_CONFIG) e gli SDK "compat" di Firebase già caricati. */
(function () {
  'use strict';
  const ALLOWED_HINT = 'Accedi con l’account del chiosco';
  let appReady = null;

  // --- utilità: Firestore non accetta undefined e, in update(), un oggetto annidato SOSTITUISCE la mappa.
  const clean = v => v === undefined ? null : v;
  function sanitize(o) {
    if (Array.isArray(o)) return o.map(sanitize);
    if (o && typeof o === 'object' && !(o instanceof Date)) { const r = {}; for (const k of Object.keys(o)) if (o[k] !== undefined) r[k] = sanitize(o[k]); return r; }
    return clean(o);
  }
  // {a:1, b:{c:2}} -> [['a'],1, ['b','c'],2]: così update() fonde le mappe come faceva claude.db
  function flatten(obj, pre, out) {
    for (const k of Object.keys(obj)) {
      const v = obj[k]; if (v === undefined) continue;
      const path = pre.concat(k);
      if (v && typeof v === 'object' && !Array.isArray(v) && !(v instanceof Date) && Object.keys(v).length) flatten(v, path, out);
      else out.push([path, sanitize(v)]);
    }
    return out;
  }
  function wrapDoc(fs, ref) {
    return {
      id: ref.id, path: ref.path,
      collection: p => wrapCol(fs, ref.collection(p)),
      get: () => ref.get(),
      set: d => ref.set(sanitize(d)),
      update: d => {
        const pairs = flatten(d || {}, [], []);
        if (!pairs.length) return Promise.resolve();
        const args = []; pairs.forEach(([p, v]) => { args.push(new firebase.firestore.FieldPath(...p), v); });
        return ref.update(...args);
      },
      delete: () => ref.delete(),
      onSnapshot: (a, b) => ref.onSnapshot(a, b)
    };
  }
  function wrapQuery(q) {
    return {
      orderBy: (f, d) => wrapQuery(q.orderBy(f, d)),
      limit: n => wrapQuery(q.limit(n)),
      get: () => q.get(),
      onSnapshot: (a, b) => q.onSnapshot(a, b)
    };
  }
  function wrapCol(fs, ref) {
    return Object.assign(wrapQuery(ref), {
      path: ref.path,
      doc: id => wrapDoc(fs, id ? ref.doc(id) : ref.doc()),
      add: async d => { const r = await ref.add(sanitize(d)); return wrapDoc(fs, r); }
    });
  }
  const PFX = () => String(window.DB_PREFIX || '');   // area test: prefisso sul nome della raccolta di primo livello (t_users, t_ledger, ...)
  const dbApi = fs => ({ doc: p => wrapDoc(fs, fs.doc(PFX() + p)), collection: p => wrapCol(fs, fs.collection(PFX() + p)) });

  const downloadsApi = {
    save: async ({filename, data, type}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type: type || 'application/octet-stream'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename || 'download';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };

  function loginOverlay(auth) {
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1b120d;color:#f3e6cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:16px system-ui,sans-serif;text-align:center;padding:24px';
      ov.innerHTML = '<div style="font-size:1.6rem;font-weight:800;letter-spacing:.04em">CHIOSCO D’UFFICIO</div><div style="opacity:.8;max-width:340px">' + ALLOWED_HINT + '</div><button id="cs-login" style="font:inherit;font-weight:700;padding:12px 22px;border:0;border-radius:10px;background:#e7c98f;color:#2b1b13;cursor:pointer">Accedi con Google</button><div id="cs-err" style="color:#ff9b8f;min-height:1.3em;max-width:340px"></div>';
      document.body.appendChild(ov);
      ov.querySelector('#cs-login').onclick = async () => {
        try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { ov.querySelector('#cs-err').textContent = 'Accesso non riuscito: ' + (e && e.code || e); }
      };
      auth.onAuthStateChanged(u => { if (u) { ov.remove(); resolve(u); } });
    });
  }

  function init() {
    if (appReady) return appReady;
    appReady = (async () => {
      if (!window.firebase || !window.FIREBASE_CONFIG) return null;
      const app = firebase.initializeApp(window.FIREBASE_CONFIG);
      const auth = firebase.auth(); const fs = firebase.firestore();
      try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (_) {}
      await new Promise(r => { const un = auth.onAuthStateChanged(u => { un(); r(u); }); });
      if (!auth.currentUser) await loginOverlay(auth);
      return {db: dbApi(fs), auth};
    })();
    return appReady;
  }
  window.claude = {
    use: async name => {
      if (name === 'downloads') return downloadsApi;
      if (name === 'db') { const r = await init(); return r ? r.db : null; }
      return null;
    }
  };
  window.claudeShim = {sanitize, flatten};
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: insegna del chiosco su fondo caffè con QR PayPal accanto; una riga beige per ogni utente, tasti nei marroni scuri. Look unico, senza variante chiara/scura. */
:root{
  --bg:#2B1B13; --page-ink:#F6EAD3; --page-muted:#C2AA8E; --page-line:#5E4333;
  --surface:#EFE3CF; --surface-2:#E2D2B5; --ink:#2B1B13; --muted:#6E5948; --line:#CDB896;
  --accent:#2B1B13; --accent-ink:#F6EAD3;
  --btn:#5B3D2C; --btn-hover:#6D4A36; --btn-ink:#F8EEDB;
  --cta:#DDBB84; --cta-ink:#2B1B13;
  --gold:#C08A0A; --star-ink:#7A5A00; --gold-bg:#5A4313; --gold-ink:#F7D27A; --gold-line:#7C5E1E;
  --danger:#B3261E; --danger-bg:#F4D6CE; --focus:#1B6EF3;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--page-ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:22px 56px}
.page{max-width:1240px;margin-inline:auto}
.tk{overflow:hidden;white-space:nowrap;background:linear-gradient(180deg,#2E1E14,#1A100A);color:#F7D27A;font-size:.86rem;font-weight:600;margin:-22px -16px 22px;padding:8px 0;border-bottom:1px solid #C08A0A;position:sticky;top:0;z-index:31}
.tk::before,.tk::after{content:"";position:absolute;top:0;bottom:0;width:28px;z-index:1;pointer-events:none}
.tk::before{left:0;background:linear-gradient(90deg,#1A100A,transparent)}.tk::after{right:0;background:linear-gradient(270deg,#1A100A,transparent)}
.tk-in{display:inline-flex;animation:tk-scroll var(--d,40s) linear infinite;will-change:transform}
.tk:hover .tk-in,.tk:focus-within .tk-in{animation-play-state:paused}
.tk-seq{display:inline-block;padding-right:40px}
.tk-it{display:inline-block}.tk-it i{font-style:normal;margin-right:6px}.tk-it b{color:#FFE9B0}
.tk-sep{display:inline-block;margin:0 22px;color:#C08A0A;opacity:.8}
@keyframes tk-scroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{overflow-x:auto}.tk-in{animation:none}.tk-in .tk-seq+.tk-seq{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.star{width:22px;height:22px;flex:none;fill:var(--gold)}

/* insegna */
.masthead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.7rem,10.5vw,4.8rem);line-height:.86;letter-spacing:.015em;text-transform:uppercase;margin:0;text-wrap:balance}
.pays{display:grid;grid-template-columns:auto auto;justify-items:center;align-items:start;gap:6px 16px}
.pays-cap{grid-column:1/-1;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--page-muted);white-space:nowrap}
.pay{display:flex;flex-direction:column;align-items:center;gap:6px;color:inherit;text-decoration:none;border-radius:12px}
.pay-rvl{font:800 1.05rem/1 var(--font-display,system-ui),system-ui,sans-serif;letter-spacing:.02em;color:#111;text-transform:none;padding:9px 12px}
.qr{width:104px;height:104px;background:#fff;padding:5px;border-radius:8px}
.qr svg{display:block;width:100%;height:100%}
#bl-s1[hidden],#bl-s2[hidden]{display:none!important}
.pay-logo{display:inline-flex;background:#fff;border-radius:8px;padding:6px 9px;margin-bottom:4px}.pay-logo img{display:block;height:34px;width:auto}
.pay-name{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:1.35rem;letter-spacing:.04em;color:var(--page-ink);margin-bottom:2px}
.pay-name svg.i{width:20px;height:20px}
.pay-cap{display:flex;flex-direction:column;align-items:flex-start;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--page-muted);max-width:none;white-space:nowrap;line-height:1.25}
.rates{margin:14px 0 0;color:var(--page-muted)}
.rates b{color:var(--page-ink);font-weight:700}
.rates{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.lg{display:inline-flex;align-items:center;gap:8px}

.rates svg.star{width:15px;height:15px;vertical-align:-2px}

/* barra */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-block:24px 8px}

.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--page-muted);pointer-events:none}
input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-height:46px}
.search input{padding-left:44px;background:#3B271C;border-color:var(--page-line);color:var(--page-ink);color-scheme:dark}

.masthead,.toolbar,.meta,.empty{--focus:#FFD58A}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{font:inherit;font-weight:600;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--page-line);background:transparent;color:var(--page-ink);cursor:pointer}
.fbtn:hover{border-color:var(--page-muted)}
.fbtn[aria-pressed="true"]{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.fbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.meta{display:flex;align-items:center;gap:8px;color:var(--page-muted);font-size:.9rem;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--page-muted)}
.dot.live{background:#5CCB8E}

.btn{font:inherit;font-weight:600;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn:hover:not(:disabled){background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:#43291B;border-color:#43291B}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.cta:hover:not(:disabled){background:#E8C998;border-color:#E8C998}
.btn.gold{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-ink)}
.btn.gold:hover:not(:disabled){background:#6A4F17;border-color:var(--gold-line)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:#97201A;border-color:#97201A}
.btn.ghost{background:transparent;border-color:#B49C7B;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:#B49C7B}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .tag.use-gold{color:#FFD84D;font-weight:700;background:rgba(255,216,77,.16)}
.btn .tag.use-prize{color:#FF8C98;font-weight:700;background:rgba(229,40,60,.22)}
.btn .tag{font-weight:600;font-size:.84rem;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.15)}
.btn:focus-visible,input:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.icon-btn{font:inherit;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn.lbl{flex-direction:row;gap:5px;width:auto;min-width:0;height:34px;padding:0 8px;font-size:.72rem;font-weight:600;line-height:1.1;white-space:nowrap}
.icon-btn.lbl svg.i{width:18px;height:18px}
.icon-btn:hover:not(:disabled){background:var(--danger-bg);color:var(--danger)}
.icon-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* righe utente */
.grid{display:flex;flex-direction:column;gap:10px}
.user{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;display:grid;grid-template-columns:minmax(150px,1fr) minmax(210px,1fr);align-items:center;gap:10px 20px;min-width:0}
.user .actions{grid-column:1 / -1;flex-wrap:wrap;min-width:0}
.avfx{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:max(4px,calc(50% - 300px));height:min(46vh,340px);z-index:67;pointer-events:none;opacity:0;transform:translateY(30px);transition:opacity .3s ease,transform .4s cubic-bezier(.2,.9,.3,1.25)}
.avfx.in{opacity:1;transform:none}
.avfx .avs{display:block;height:100%;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transform-origin:50% 100%}
.avfx.hop .avs{animation:av-hop .66s ease-in-out infinite}
@keyframes av-hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.03,.96)}55%{transform:translateY(-18px) scale(.98,1.03)}}
.avfx.sad .avs{animation:av-sway 1.8s ease-in-out infinite}
@keyframes av-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.avfx.hop2 .avs{animation:av-hop2 .45s ease-in-out infinite}
@keyframes av-hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
.avfx.bow .avs{animation:av-bow 1.5s ease-in-out infinite}
@keyframes av-bow{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(9deg) translateY(4px)}}
.avfx.shake .avs{animation:av-shake .28s linear infinite}
@keyframes av-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.avfx.spin .avs{animation:av-spin 1.3s ease-in-out infinite}
@keyframes av-spin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-30px) rotateY(180deg)}80%,100%{transform:translateY(0) rotateY(360deg)}}
.avfx.slow .avs{animation:av-sway 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.avfx .avs{animation:none!important}}

.user.hasav .sub-l{gap:6px;flex-wrap:wrap}
.user.hasav .u-id .floor{font-size:.68rem;padding:1px 8px;min-height:20px}

.avb.wp{width:88px}
.user.hasav.wp{padding-left:119px!important}
@media (max-width:640px){.user.hasav.wp{padding-left:107px!important}.avb.wp{width:84px}}
.av-pill{padding:6px 14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer}
.av-pill.on{border-color:var(--accent);background:var(--surface);font-weight:700}
.avb:hover{background:rgba(0,0,0,.05)}
@media (hover:hover) and (pointer:fine){
body.hzoom .user{transition:transform .18s ease,box-shadow .18s ease;transform-origin:center}
body.hzoom .user:hover{transform:scale(1.05);position:relative;z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.4)}
}
@media (prefers-reduced-motion:reduce){body.hzoom .user{transition:none}}
@keyframes hv-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.avb.hv-hop svg{animation:hv-hop .38s ease-in-out infinite}
@keyframes hv-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.avb.hv-shake svg{animation:hv-shake .3s linear infinite}.avb.hv-sway svg{animation:hv-sway .6s ease-in-out infinite;transform-origin:50% 100%}.avb.hv-spin svg{animation:hv-spin 1.1s ease-in-out 1}.avb.hv-slow svg{animation:hv-slow 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.avb.hv-hop svg,.avb.hv-shake svg,.avb.hv-sway svg,.avb.hv-spin svg,.avb.hv-slow svg{animation:none}}
.avb:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.avb .avs{display:block;width:100%;height:100%}

.av-pinbox{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.av-pinbox[hidden]{display:none}
.av-pinbox p{margin:0;font-size:.92rem;line-height:1.45}

@media (max-width:640px){.user.hasav{padding-left:80px!important}.avb{width:60px;left:8px}}
.av-main{flex:none;display:flex;gap:16px;align-items:flex-start}

.sheet.adm{max-width:900px}
.hist th.r,.hist td.r{text-align:right;white-space:nowrap}
.hist tr.grp td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--line)}
.log-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.log-bar input{max-width:260px}
.th-sort{font:inherit;font-weight:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.th-sort:hover{color:var(--ink)}
.hist th.r .th-sort{text-align:right}
.hist tr.inact td{background:rgba(179,38,30,.07)}
.badge.warn{background:var(--danger-bg);color:var(--danger);margin-left:0}
.hist tfoot td{position:sticky;bottom:0}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sec-f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}
.sec-f input{min-height:42px;padding:8px 12px}
.sec-sel{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.85rem}
.badge.sev-hi{background:var(--danger-bg);color:var(--danger);margin-left:0}
.badge.sev-med{background:#F6E3B4;color:#7A5A00;margin-left:0}
.badge.sev-low{background:var(--surface-2);color:var(--muted);margin-left:0}
.log-sum{color:var(--muted);font-size:.92rem}
.sheet h2{margin:0;font-family:var(--font-display);font-size:2rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.m-sub{margin:-8px 0 0;color:var(--muted);font-weight:600}
.sheet label{font-weight:600;font-size:.92rem}
.sheet p{margin:0}
.money{position:relative}
.money input{font-size:1.5rem;font-weight:700;padding-right:44px;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:99px;padding:8px 16px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--muted)}
.preview{color:var(--muted);min-height:2.6em}
.preview b{color:var(--ink)}
.err{color:var(--danger);font-weight:600}
.m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.warn{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;font-weight:600}
.hist-wrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
table.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;color:var(--ink);font:inherit}
.hist th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:9px 12px}
.hist td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.hist td.t{white-space:nowrap;color:var(--muted)}
.hist tr.undone td{color:var(--muted)}
.hist tr.undone .act{text-decoration:line-through}
.badge{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);text-decoration:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (max-width:480px){
  .qr{width:88px;height:88px}
  .bal{font-size:2.6rem}
  .sheet{padding:18px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.chip{transition:background-color .12s,filter .12s}
}

/* barra in alto: sezioni e lingue */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.navbtn{font:inherit;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;min-height:40px;padding:8px 16px;border-radius:99px;border:1px solid var(--page-line);background:transparent;color:var(--page-ink);cursor:pointer}
.navbtn:hover{border-color:var(--page-muted);background:rgba(246,234,211,.07)}
.navbtn:focus-visible{outline:3px solid #FFD58A;outline-offset:2px}
.langs{display:flex;gap:6px;margin-left:6px}
.lang{display:inline-flex;padding:3px;border-radius:8px;border:2px solid transparent;background:transparent;cursor:pointer;opacity:.6}
.lang:hover{opacity:1}
.lang[aria-pressed="true"]{opacity:1;border-color:var(--cta)}
.lang:focus-visible{outline:3px solid #FFD58A;outline-offset:2px}
svg.flag{width:30px;height:20px;border-radius:3px;display:block}
.sheet .langs{margin-left:0;flex:none}
.sheet .lang[aria-pressed="true"]{border-color:var(--accent)}
.sheet .lang:focus-visible{outline-color:var(--focus)}

/* About us e Help */
.sheet.doc{max-width:700px}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.doc .lead{font-size:1.1rem;line-height:1.5;max-width:60ch}
.doc p{line-height:1.55;max-width:62ch}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}

.sign{color:var(--muted);font-weight:600}

.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.founders{flex:none;background:var(--surface-2);border-radius:12px;margin-bottom:10px;overflow:hidden}
.founders .f-h{display:flex;align-items:center;gap:10px;background:var(--btn);color:var(--page-ink);font-family:var(--font-display);font-size:1.15rem;letter-spacing:.08em;padding:10px 16px}

.founders li .pi{flex:none;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--page-ink);display:inline-flex;align-items:center;justify-content:center}
.founders li .pi svg.i{width:16px;height:16px}
.member{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.member b{display:block;font-size:1.02rem;line-height:1.25}
.member .role{display:block;color:var(--muted);font-size:.85rem;line-height:1.3;margin-top:2px}

.tface{overflow:hidden;background:none!important}.tface .bd-face{width:100%;height:100%;border-width:1.5px}

.bd-seg .bd-tab[aria-pressed=true]{background:#C48A0A;border-color:#C48A0A;color:#fff}
.bd-list{list-style:none;margin:14px 0 4px;padding:0;display:flex;flex-direction:column;gap:7px}
.bd-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bd-row.p1{background:linear-gradient(90deg,rgba(255,215,90,.38),rgba(255,215,90,.06));border-color:#D9A21B}
.bd-row.p2{background:linear-gradient(90deg,rgba(200,208,218,.5),rgba(200,208,218,.08));border-color:#9AA4B2}
.bd-row.p3{background:linear-gradient(90deg,rgba(214,150,96,.4),rgba(214,150,96,.07));border-color:#B8743A}
.bd-rk{flex:none;width:38px;display:flex;justify-content:center;font-weight:900;font-size:1.05rem;opacity:.7}
.bd-rk svg{display:block}
.bd-pz{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:96px;text-align:center;color:#C81E34}
.bd-pz-st{display:flex;gap:1px;justify-content:center;flex-wrap:wrap}
.bd-pz-st svg.star{width:15px;height:15px;fill:#E5283C;stroke:#FF9AA5;stroke-width:.6;stroke-linejoin:round;filter:drop-shadow(0 0 2.5px rgba(255,60,80,.75))}
@media (prefers-reduced-motion:no-preference){.bd-pz-st svg.star{animation:rdglit 1.9s ease-in-out infinite}}
.bd-pz small{font-size:.66rem;font-weight:700;line-height:1.15}
.bd-rk.rkm{opacity:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.bd-face{flex:none;width:50px;height:50px;border-radius:50%;overflow:hidden;background:linear-gradient(#EFE6D6,#E2D5BD);border:2px solid rgba(43,27,19,.18);display:flex;align-items:flex-end;justify-content:center;font-weight:800;color:#8a7a66}
.bd-row.p1 .bd-face{border-color:#D9A21B}.bd-row.p2 .bd-face{border-color:#9AA4B2}.bd-row.p3 .bd-face{border-color:#B8743A}
.bd-face svg{width:100%;height:100%;display:block}
.bd-cpl{font-size:.85em;margin-left:2px}
.bd-nm{flex:1;min-width:0;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.bd-row.p1 .bd-nm,.bd-row.p2 .bd-nm,.bd-row.p3 .bd-nm{font-size:1.15rem;font-weight:800}
.bd-fl{display:block;font-size:.72rem;font-weight:600;opacity:.6}
.bd-empty{padding:26px 8px;text-align:center;color:var(--muted)}
.bd-note{margin:12px 0 0;font-size:.78rem;color:var(--muted)}

    let working = false;
    $('#rm-form', sheet).addEventListener('submit', async e => {

      if (!/^\d{4}$/.test(v)) return fail('pinFmt');

      working = true; okBtn.disabled = true;

        for (;;) {
          const s = await txc.limit(100).get();

          for (let i = 0; i < s.docs.length; i += 10) {
            await Promise.all(s.docs.slice(i, i + 10).map(d => txc.doc(d.id).delete()));
          }
        }
        await db.doc('users/' + id).delete();
        deleted = true;
        toast(t('tRemoved', {name: u.name}));
      } catch (er) {
        if (logId && !deleted) { try { await db.doc('ledger/' + logId).delete(); } catch (_) {} }
        handleErr(er);
      }
      finally { pending.delete(id); render(); }
    });
  }

  const sha = async s => {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('chiosco:' + s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    return 'b64:' + btoa('chiosco:' + s);
  };

      X.utils.book_append_sheet(wb, w1, ft('sheetSum') + ' ' + y); X.utils.book_append_sheet(wb, w2, ft('sheetMov') + ' ' + y);
      const data = X.write(wb, {bookType: 'xlsx', type: 'array'});

      toast(ft('exOk'));
    } catch (e) { if (e && e.code === 'declined') return; toast(ft('exFail')); }
  }

  /* ---------- avvio ---------- */
  function showUnavailable() {
    unavailable = true;
    $('#count').textContent = t('dataUnavail');

  }
  async function init() {
    if (BACHECA && location.hash === '#bkcam') { document.open(); document.write(bkPopHTML()); document.close(); return; }
    applyStatic();
    $('#count').textContent = t('loading');
    try {
      db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    } catch (e) { db = null; }
    if (!db) { showUnavailable(); return; }
    try { db.doc('settings/security').onSnapshot(sn => { secCfg = Object.assign({}, SEC_DEFAULTS, sn.exists ? sn.data() : {}); }, () => {}); } catch (_) {}
    try { db.doc('settings/badges').onSnapshot(sn => { badgeCfg = Object.assign({}, BDG_DEF, sn.exists ? sn.data() : {}); updateRates(); if (typeof render === 'function' && users && users.size) render(); if (adm.view === 'bdg') paintBdgList(); }, () => {}); } catch (_) {}
    if (FIN) { try { db.doc('settings/fin').onSnapshot(sn => { finCfg = {autoOn: true}; if (modal && modal.ov && adm.view === 'fin') { const sh = modal.ov.firstElementChild; if (sh && sh.classList.contains('adm')) paintFin(sh); } }, () => {}); } catch (_) {} }

    if (BACHECA) startBacheca();
    if (BOARDS) setInterval(gcSyncRun, 600000);
    db.collection('users').onSnapshot(snap => {
      users = new Map(snap.docs.map(d => [d.id, Object.assign({id: d.id}, d.data())]));
      if (BOARDS) gcHist();
      ready = true; render(); tickerUpdate();
      if (BOARDS) gcSync();
      if (MEDALS_ON || BOARDS) checkPodiumMonths();
      if (MEDALS_ON) { const fp = [...users.values()].filter(u => famFull(u, medalsEarned(u)).length).map(u => u.id); if (fp.length) checkFamPrizes(fp); }
      if (modal && modal.onUsers) modal.onUsers();
    }, e => { ready = false; handleErr(e); showUnavailable(); });
  }
  /* ---------- Banner scorrevole (news, benvenuti, bollini, classifica, eventi) ---------- */
  const TICKER = true;
  const TK = {
    it: {news: 'Novità', wel: 'Un caloroso benvenuto a {n}!', gc: 'Congratulazioni a {n}: Grande Consumatore questa settimana!', sc: 'Congratulazioni a {n}: Super Consumatore questa settimana!', top: 'In testa alla classifica settimanale: {n}', le: 'È tempo di {e}: costumi Limited edition per l’avatar fino al {d}', last: 'Ultimi giorni per i costumi di {e}!', and: ' e ', more: ' e altri {k}', back: 'Bentornato {n}! Che bello rivederti al chiosco', away: '{n}, è un po\u2019 che non ti vediamo: il caffè ti aspetta!'},
    en: {news: 'News', wel: 'A warm welcome to {n}!', gc: 'Congratulations to {n}: Great Consumer this week!', sc: 'Congratulations to {n}: Super Consumer this week!', top: 'Leading the weekly ranking: {n}', le: 'It’s {e} time: Limited edition avatar costumes until {d}', last: 'Last days for the {e} costumes!', and: ' and ', more: ' and {k} more', back: 'Welcome back {n}! Great to see you at the kiosk again', away: '{n}, it has been a while: your coffee is waiting!'}
  };
  let tkSig = '';
  function tickerItems() {
    const L = lang === 'en' ? 'en' : 'it', X = TK[L], now = new Date(), out = [];
    const names = a => { const m = a.slice(0, 5).map(x => '<b>' + esc(x) + '</b>'); const rest = a.length - 5; return rest > 0 ? m.join(', ') + X.more.replace('{k}', rest) : m.length > 1 ? m.slice(0, -1).join(', ') + X.and + m[m.length - 1] : m[0]; };
    try { freshNews().slice(0, 3).forEach(n => out.push({ico: '📰', h: '<b>' + esc(X.news) + ':</b> ' + esc(n.title || '') + (n.text ? ' — ' + esc(String(n.text).replace(/\s+/g, ' ').slice(0, 90)) + (String(n.text).length > 90 ? '…' : '') : ''), news: 1})); } catch (_) {}
    const U = [...users.values()].filter(u => u && u.name);
    const nw = U.filter(u => u.createdAt && now - u.createdAt < 7 * 864e5).sort((p, q) => q.createdAt - p.createdAt).slice(0, 4);
    nw.forEach(u => out.push({ico: '👋', h: X.wel.replace('{n}', '<b>' + esc(u.name) + '</b>')}));
    {
      const BASE = new Date(2026, 9, 7), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dOf = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }, dd = (a, b) => Math.round((b - a) / 864e5);
      const away = [], backs = [];
      U.forEach(u => {
        if (u.createdAt && now - u.createdAt < 7 * 864e5) return;
        const days = Object.keys(u.cd || {}).filter(k => u.cd[k] > 0).map(dOf).sort((p, q) => p - q);
        let b0 = BASE; if (u.createdAt) { const c = new Date(u.createdAt), c0 = new Date(c.getFullYear(), c.getMonth(), c.getDate()); if (c0 > b0) b0 = c0; }
        const last = days.length ? days[days.length - 1] : null, prev = days.length > 1 ? days[days.length - 2] : null;
        if (last && last >= BASE && dd(last, t0) >= 0 && dd(last, t0) <= 4 && dd(prev && prev > b0 ? prev : b0, last) >= 10) { backs.push([u, last]); return; }
        const ref = last && last > b0 ? last : b0, gap = dd(ref, t0);
        if (gap >= 10) away.push([u, gap]);
      });
      backs.sort((p, q) => p[1] - q[1]).forEach(p => out.push({ico: '\uD83E\uDD17', h: X.back.replace('{n}', '<b>' + esc(p[0].name) + '</b>')}));
    }
    const lv = U.map(u => [u, badgeLevel(u.cd, now)]);
    const sc = lv.filter(p => p[1] === 2).map(p => p[0].name), gc = lv.filter(p => p[1] === 1).map(p => p[0].name);
    if (!BOARDS) sc.forEach(nm => out.push({ico: '\uD83D\uDD34', h: X.sc.replace('{n}', '<b>' + esc(nm) + '</b>')}));
    if (!BOARDS) gc.forEach(nm => out.push({ico: '\uD83D\uDD35', h: X.gc.replace('{n}', '<b>' + esc(nm) + '</b>')}));
    const wt = U.filter(u => !BOARDS || rkOk(u)).map(u => [u, weekTotal(u.cd, now)]), mx = Math.max(0, ...wt.map(p => p[1]));
    if (mx > 0) out.push({ico: '🥇', h: X.top.replace('{n}', names(wt.filter(p => p[1] === mx).map(p => p[0].name)))});
    if (BOARDS) {
      const mr = curMonthRanks(), g = [[], [], []];
      mr.forEach((rk, id) => { const u = users.get(id); if (u && u.name) g[rk - 1].push('<b>' + esc(u.name) + '</b>'); });
      const parts = g.map((a, i) => a.length ? ['🥇', '🥈', '🥉'][i] + ' ' + a.join(' / ') : '').filter(Boolean);
      if (parts.length) out.push({ico: '🏆', h: (L === 'en' ? 'Top 3 of the current month: ' : 'La top 3 del mese in corso: ') + parts.join(' &nbsp;·&nbsp; ')});
    }
    LE_EV.forEach((E, ei) => { const y = leInst(ei, now); if (!y) return; const w = leWin(ei, y), left = (w[1] - now) / 864e5;
      out.push({ico: E.ico, h: X.le.replace('{e}', '<b>' + esc(E[L]) + '</b>').replace('{d}', w[1].toLocaleDateString(locale(), {day: 'numeric', month: 'long'}))});
      if (left <= 3) out.push({ico: '⏳', h: X.last.replace('{e}', esc(E[L]))}); });
    return out;
  }
  function tickerUpdate() {
    if (!TICKER || !users || !users.size) return;
    let el = document.getElementById('ticker');
    if (!el) { el = document.createElement('div'); el.id = 'ticker'; el.className = 'tk'; el.setAttribute('role', 'marquee'); el.setAttribute('aria-label', 'News'); const pg = document.querySelector('.page'); if (!pg) return; pg.insertBefore(el, pg.firstChild);
      el.addEventListener('click', e => { if (e.target.closest('[data-tknews]')) openNS('news', false); }); }
    const it = tickerItems();
    if (!it.length) { el.hidden = true; tkSig = ''; document.documentElement.style.setProperty('--tkh', '0px'); return; }
    const seq = it.map(x => '<span class="tk-it"' + (x.news ? ' data-tknews="1" style="cursor:pointer"' : '') + '><i aria-hidden="true">' + x.ico + '</i>' + x.h + '</span>').join('<span class="tk-sep" aria-hidden="true">✦</span>');
    const sig = seq + '|' + lang;
    el.hidden = false;
    const setH = () => document.documentElement.style.setProperty('--tkh', el.offsetHeight + 'px');
    if (sig === tkSig) { setH(); return; }
    tkSig = sig;
    el.innerHTML = '<div class="tk-in"><span class="tk-seq">' + seq + '</span></div>';
    const inn = el.firstChild, first = inn.firstChild, cw = el.clientWidth || 800;
    const sw = first.getBoundingClientRect().width + 40;
    const reps = Math.max(1, Math.ceil(cw / Math.max(sw, 1)));
    first.innerHTML = Array(reps).fill(seq).join('<span class="tk-sep" aria-hidden="true">✦</span>');
    const w2 = first.getBoundingClientRect().width;
    inn.appendChild(first.cloneNode(true)).setAttribute('aria-hidden', 'true');
    el.style.setProperty('--d', Math.max(20, Math.round((w2 + 40) / 55)) + 's');
    setH();
  }
  if (TICKER) setInterval(tickerUpdate, 600000);

  /* anteprima temi (solo area test) */
  if (THEMES_ON && SKDEMO) {
    const dm = document.createElement('div');
    dm.id = 'th-demo';
    const NM = [['auto', 'Automatico'], ['none', 'Classica']].concat(THK.map((k, i) => [k, LE_EV[i].ico + ' ' + LE_EV[i].it]));
    const paint = () => { dm.querySelectorAll('.thd-c button').forEach(b => b.classList.toggle('on', b.dataset.th === (thPrev || 'auto'))); };
    dm.innerHTML = '<div class="thd-p" hidden><b>Anteprima animazioni</b><div class="thd-c">' + NM.map(n => '<button type="button" data-th="' + n[0] + '">' + esc(n[1]) + '</button>').join('') + '</div><button type="button" class="thd-go">▶ Prova di nuovo</button></div><button type="button" class="thd-t">🎬 Animazioni</button>';
    document.body.appendChild(dm);
    const play = () => celebrate('Tommaso', CONS[0], 1 + Math.floor(Math.random() * 2));
    dm.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('thd-t')) { const p = $('.thd-p', dm); p.hidden = !p.hidden; paint(); return; }
      if (b.classList.contains('thd-go')) { play(); return; }
      if (b.dataset.th) { thPrev = b.dataset.th === 'auto' ? null : b.dataset.th; paint(); $('.thd-p', dm).hidden = true; play(); }
    });
  }
  /* ---------- Hover: l'avatar nella scheda saluta / fa una mossa ---------- */
  const HOVERFX = true;
  if (true) document.body.classList.add('hzoom');
  if (HOVERFX && AVATAR) {
    const hp = {eyeS: 2, mouth: 1}, st = {eyeS: 11, mouth: 1}, wk = {eyeS: 10, mouth: 1}, hs = {eyeS: 10, mouth: 1};
    const sp = {eyeS: 5, mouth: 1}, gl = {eyeS: 9, mouth: 0}, cl = {eyeS: 4, mouth: 7}, no = {eyeS: 8, mouth: 2}, su = {eyeS: 5, mouth: 4};
    const HV = [
      {fr: [{pose: [4, 152], mood: hp}, {pose: [4, 124], mood: hp}], iv: 260, ms: 2200},
      {fr: [{pose: [152, 4], mood: wk}, {pose: [124, 4], mood: wk}], iv: 260, ms: 2200},
      {fr: [{pose: [150, 20], mood: st}, {pose: [20, 150], mood: st}], iv: 330, ms: 2200, c: 'hv-hop'},
      {fr: [{pose: [165, 165], mood: st}, {pose: [140, 140], mood: st}], iv: 380, ms: 2000, c: 'hv-hop'},
      {fr: [{pose: [60, 60], mood: hp}, {pose: [40, 40], mood: hp}], iv: 420, ms: 2000, c: 'hv-hop'},
      {fr: [{pose: [4, 150], mood: hp, cup: true}, {pose: [4, 124], mood: hp, cup: true}], iv: 450, ms: 2300},
      {fr: [{pose: [4, 140], mood: gl, cup: true}, {pose: [4, 118], mood: gl, cup: true}], iv: 700, ms: 2400, c: 'hv-slow'},
      {fr: [{pose: [150, 20], mood: hp}, {pose: [20, 150], mood: hp}], iv: 300, ms: 2400, c: 'hv-sway'},
      {fr: [{pose: [150, 150], mood: st}, {pose: [60, 60], mood: st}], iv: 500, ms: 2200, c: 'hv-spin'},
      {fr: [{pose: [60, 60], mood: no}, {pose: [50, 70], mood: no}], iv: 400, ms: 1800, c: 'hv-shake'},
      {fr: [{pose: [4, 152], mood: sp}, {pose: [4, 124], mood: sp}], iv: 280, ms: 2200},
      {fr: [{pose: [100, 100], mood: su}, {pose: [120, 120], mood: su}], iv: 400, ms: 1800, c: 'hv-hop'},
      {fr: [{pose: [165, 165], mood: st}, {pose: [165, 165], mood: hs}], iv: 300, ms: 2000, c: 'hv-hop'},
      {fr: [{pose: [40, 130], mood: cl, cup: true}, {pose: [60, 110], mood: cl, cup: true}], iv: 330, ms: 2200, c: 'hv-sway'}
    ];
    const sd = {eyeS: 0, mouth: 6}, cy = {eyeS: 0, mouth: 6}, sl = {eyeS: 9, mouth: 6};
    const HVS = [
      {fr: [{pose: [4, 100], mood: cy, tear: 1}, {pose: [4, 84], mood: cy, tear: 1}], iv: 420, ms: 2400},
      {fr: [{pose: [100, 4], mood: cy, tear: 1}, {pose: [84, 4], mood: cy, tear: 1}], iv: 420, ms: 2400},
      {fr: [{pose: [96, 96], mood: cy, tear: 1}, {pose: [76, 76], mood: cy, tear: 1}], iv: 500, ms: 2400, c: 'hv-slow'},
      {fr: [{pose: [28, 28], mood: sd}, {pose: [20, 20], mood: sd}], iv: 600, ms: 2400, c: 'hv-slow'},
      {fr: [{pose: [8, 8], mood: sd}, {pose: [4, 4], mood: sd}], iv: 500, ms: 2200, c: 'hv-sway'},
      {fr: [{pose: [10, 10], mood: sd}, {pose: [6, 6], mood: sd}], iv: 400, ms: 1900, c: 'hv-shake'},
      {fr: [{pose: [4, 4], mood: sl, tear: 1}, {pose: [4, 4], mood: sl, tear: 1}], iv: 700, ms: 2400, c: 'hv-slow'},
      {fr: [{pose: [60, 60], mood: cy, tear: 1}, {pose: [46, 46], mood: cy, tear: 1}], iv: 600, ms: 2400, c: 'hv-slow'}
    ];
    const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let hvCard = null, hvBtn = null, hvHTML = '', hvI = 0, hvT2 = 0, hvLast = -1;
    const hvStop = () => {
      clearInterval(hvI); clearTimeout(hvT2);
      if (hvBtn && hvBtn.isConnected && hvHTML) { hvBtn.innerHTML = hvHTML; hvBtn.classList.remove('hv-hop', 'hv-shake', 'hv-spin', 'hv-sway', 'hv-slow'); }
      hvCard = hvBtn = null; hvHTML = '';
    };
    const hvStart = card => {
      if (reduce()) return;
      const btn = card.querySelector('.avb:not(.noav)'); if (!btn) return;
      const u = users.get(btn.dataset.id); if (!u || !u.avatar) return;
      hvStop();
      const HL = inDebt(u) ? HVS : HV;
      let vi = Math.floor(Math.random() * HL.length); if (vi === hvLast) vi = (vi + 1) % HL.length; hvLast = vi;
      const V = HL[vi]; let k = 0;
      hvCard = card; hvBtn = btn; hvHTML = btn.innerHTML;
      const draw = () => { btn.innerHTML = avSVG(avEff(u), 200, false, undefined, Object.assign({tick: k % 2}, V.fr[k % V.fr.length])); k++; };
      draw(); if (V.c) btn.classList.add(V.c);
      hvI = setInterval(draw, V.iv); hvT2 = setTimeout(hvStop, V.ms);
    };
    listEl.addEventListener('mouseover', e => {
      const card = e.target.closest && e.target.closest('.user.hasav'); if (!card || card === hvCard) return;
      if (e.relatedTarget && card.contains(e.relatedTarget)) return;
      hvStart(card);
    });
    listEl.addEventListener('mouseout', e => {
      const card = e.target.closest && e.target.closest('.user.hasav'); if (!card || card !== hvCard) return;
      if (e.relatedTarget && card.contains(e.relatedTarget)) return;
      hvStop();
    });
  }
  init();
})();
